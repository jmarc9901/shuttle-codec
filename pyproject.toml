[project]
name = "shuttle-codec"
# Single source of truth: src/__init__.py __version__ (read by setuptools).
dynamic = ["version"]
description = "A modern, easy-to-use desktop GUI for FFmpeg"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "JMarc" },
]
keywords = [
    "ffmpeg",
    "video",
    "audio",
    "converter",
    "transcoding",
    "gui",
    "pyqt5",
    "desktop",
]
# No `License ::` classifier: the SPDX `license` expression above is the modern
# equivalent and setuptools deprecates keeping both.
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = [
    "PyQt5>=5.15.0",
]

[project.urls]
Homepage = "https://github.com/jmarc9901/shuttle-codec"
Repository = "https://github.com/jmarc9901/shuttle-codec"
Issues = "https://github.com/jmarc9901/shuttle-codec/issues"
Changelog = "https://github.com/jmarc9901/shuttle-codec/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit>=3.7",
    "types-PyQt5",
]
build = [
    "pyinstaller>=6.0",
    # PyInstaller uses Pillow to convert logo.png into the platform icon.
    "pillow>=10.0",
]

[project.scripts]
shuttle-codec = "src.main:main"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.dynamic]
version = { attr = "src.__version__" }

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# The PyQt5 UI module is exercised headlessly (smoke tests), so full coverage
# there is not meaningful; this floor guards against silent regressions.
fail_under = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "S"]
# N802/N806/N803: Qt methods use camelCase by design.
# S603/S607: the app runs external tools (ffmpeg/ffprobe, the platform file
#            manager) that live on PATH, always with an argument list and never
#            through a shell, which is precisely the safe way to do it.
ignore = ["N802", "N806", "N803", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# i18n.py holds long unbreakable string literals (filters, HTML, messages).
"src/i18n.py" = ["E501"]
# Tests create temp media files with delete=False and clean them up explicitly;
# `assert` and dummy /tmp paths are the normal way to write these tests.
"tests/*" = ["SIM115", "S101", "S108"]
# create_demo.py imports the app after adjusting sys.path/os.chdir on purpose,
# and shells out to a fixed, developer-only FFmpeg command.
"create_demo.py" = ["E402", "S605"]
# The downloader reaches fixed https:// URLs, deliberately chmods the extracted
# FFmpeg binary to 0755 and falls back to the literal `brew/apt/dnf/pacman/
# zypper` install commands when the download fails.
"download_ffmpeg.py" = ["S310", "S103", "S605"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# `strict` (untyped defs, Any leaking, stale `type: ignore`, ...) is enforced on
# the application code, so a wrong annotation fails CI instead of drifting.
strict = true
warn_unreachable = true
# Third-party Qt bindings ship no stubs; only our modules are checked.
exclude = ["build", "dist"]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"
