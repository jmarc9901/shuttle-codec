name: Release Build

on:
  push:
    tags:
      - 'v*'

# Least privilege by default; each job widens it only where it must.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Build provenance attestation (SLSA) signs with the workflow identity.
      id-token: write
      attestations: write

    # Empty unless the signing secrets exist; job-level env is what makes the
    # `env.X != ''` guards in the steps below work.
    env:
      WIN_CERT_PFX: ${{ secrets.WIN_CERT_PFX }}
      WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Read the app version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/__init__.py').read_text()).group(1))")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Make the build reproducible
        shell: bash
        # PyInstaller embeds timestamps; deriving them from the tag commit makes
        # two builds of the same commit byte-identical.
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      # Optional integrity pinning: set the repository variables
      # FFMPEG_BUILD_TAG and FFMPEG_ARCHIVE_SHA256 to make the build
      # reproducible and tamper-evident.
      - name: Download FFmpeg (Windows)
        if: runner.os == 'Windows'
        env:
          FFMPEG_BUILD_TAG: ${{ vars.FFMPEG_BUILD_TAG }}
          FFMPEG_ARCHIVE_SHA256: ${{ vars.FFMPEG_ARCHIVE_SHA256 }}
        run: python download_ffmpeg.py

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt update && sudo apt install -y ffmpeg

      - name: Build with PyInstaller
        run: python build.py

      # Only runs once WIN_CERT_PFX (base64 of the .pfx) and
      # WIN_CERT_PASSWORD are configured as repository secrets.
      - name: Sign the Windows executable
        if: runner.os == 'Windows' && env.WIN_CERT_PFX != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WIN_CERT_PFX))
          signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:WIN_CERT_PASSWORD" `
            /fd sha256 /tr http://timestamp.digicert.com /td sha256 dist\shuttle-codec.exe

      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\shuttle-codec.iss /DMyAppVersion=${{ steps.version.outputs.value }}

      - name: Package a macOS zip
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -j shuttle-codec-macos.zip shuttle-codec
          cd ..

      - name: Package an AppImage (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/shuttle-codec AppDir/usr/bin/
          cp logo.png AppDir/usr/share/icons/hicolor/256x256/apps/shuttle-codec.png
          # appimagetool resolves `Icon=` in the desktop file against the AppDir
          # root, not against the hicolor theme directory: without this copy it
          # aborts with "shuttle-codec{.png,.svg,.xpm} defined in desktop file
          # but not found" (which is why earlier releases had no AppImage).
          cp logo.png AppDir/shuttle-codec.png
          cp logo.png AppDir/.DirIcon
          cat > AppDir/shuttle-codec.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Shuttle Codec
          Comment=Convert videos and audio with FFmpeg
          Exec=shuttle-codec
          Icon=shuttle-codec
          Categories=AudioVideo;Video;
          Terminal=false
          EOF
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE=$(dirname "$(readlink -f "$0")")
          exec "$HERE/usr/bin/shuttle-codec" "$@"
          EOF
          chmod +x AppDir/AppRun
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir dist/shuttle-codec-x86_64.AppImage

      - name: Report whether the AppImage was produced
        if: runner.os == 'Linux'
        run: |
          if [ -f dist/shuttle-codec-x86_64.AppImage ]; then
            echo "AppImage built: $(du -h dist/shuttle-codec-x86_64.AppImage | cut -f1)"
          else
            echo "::warning title=AppImage not built::The best-effort AppImage step did not produce a file; the plain Linux binary is published instead."
          fi

      - name: Record the exact dependency versions
        shell: bash
        # A build manifest: the resolved versions behind this artifact, which is
        # what an SBOM generator (or a post-mortem) needs. Written after the
        # build, because PyInstaller recreates dist/.
        run: python -m pip freeze > dist/pip-freeze.txt

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, pathlib
          lines = []
          for path in sorted(pathlib.Path("dist").iterdir()):
              if path.is_file() and path.name != "SHA256SUMS.txt":
                  lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}")
          pathlib.Path("dist/SHA256SUMS.txt").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/shuttle-codec*

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: shuttle-codec-${{ runner.os }}
          path: dist/
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List artifacts
        run: ls -laR shuttle-codec-*/

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            shuttle-codec-Windows/shuttle-codec.exe
            shuttle-codec-Windows/shuttle-codec-*-setup.exe
            shuttle-codec-Windows/SHA256SUMS.txt
            shuttle-codec-Windows/pip-freeze.txt
            shuttle-codec-macOS/shuttle-codec-macos.zip
            shuttle-codec-macOS/shuttle-codec
            shuttle-codec-Linux/shuttle-codec
            shuttle-codec-Linux/shuttle-codec-x86_64.AppImage
            shuttle-codec-Linux/SHA256SUMS.txt
          fail_on_unmatched_files: false
          generate_release_notes: true
