name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff mypy types-PyQt5

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: mypy src/

      - name: Test with pytest
        run: python -m pytest tests/ -v --tb=short

      # Coverage runs once, on a single matrix cell, to keep CI fast.
      - name: Coverage gate
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: python -m pytest tests/ -q --cov=src --cov-report=term-missing

  build:
    # Guards the PyInstaller path: packaging breaks are only visible here.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Download FFmpeg
        run: python download_ffmpeg.py

      - name: Build the executable
        run: python build.py

      - name: Smoke test the executable
        shell: pwsh
        run: |
          if (-not (Test-Path dist/shuttle-codec.exe)) { throw "dist/shuttle-codec.exe was not produced" }
          Get-Item dist/shuttle-codec.exe | Select-Object Name, Length
